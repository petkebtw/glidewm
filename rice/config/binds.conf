# dwm keybinds: <Mod+Shift+key> = <action> [argument]   (Mod = Alt)
Mod+p = spawn ~/.local/share/dss/bin/rice-launch
Print = spawn ~/.local/bin/screenshot.sh
Mod+Shift+Return = spawn konsole
XF86AudioRaiseVolume = spawn dwm-volume up
XF86AudioLowerVolume = spawn dwm-volume down
XF86AudioMute = spawn dwm-volume mute
Mod+b = togglebar
Mod+minus = setgaps -2
Mod+equal = setgaps 2
Mod+Shift+equal = setgaps 0
Mod+Shift+t = spawn theme-switch
Mod+Shift+o = spawn ~/.local/share/dss/bin/rice-settings
Mod+z = spawn rice-map
Mod+Ctrl+0 = canvaszoomreset
Mod+o = spawn ~/.local/share/dss/bin/rice-settings
Mod+s = spawn ~/.local/share/dss/bin/rice-launch
Mod+v = spawn ~/.local/share/dss/bin/rice-clip toggle
Mod+Shift+m = spawn rice-media toggle
Mod+Shift+s = spawn screenshot.sh
XF86AudioPlay = spawn rice-media play-pause
XF86AudioNext = spawn rice-media next
XF86AudioPrev = spawn rice-media prev
Mod+j = focusstack 1
Mod+k = focusstack -1
Mod+i = incnmaster 1
Mod+d = incnmaster -1
Mod+h = setmfact -0.05
Mod+l = setmfact 0.05
Mod+Return = zoom
Mod+Tab = view prev
Mod+Shift+c = killclient
Mod+t = setlayout 0
Mod+space = cyclelayout 1
Mod+Ctrl+space = resetlayout
Mod+Shift+space = togglefloating
Mod+0 = view all
Mod+Shift+0 = tag all
Mod+comma = focusmon -1
Mod+period = focusmon 1
Mod+Shift+comma = tagmon -1
Mod+Shift+period = tagmon 1
Mod+F5 = xrdb
Mod+1 = view 1
Mod+Ctrl+1 = toggleview 1
Mod+Shift+1 = tag 1
Mod+Shift+Ctrl+1 = toggletag 1
Mod+2 = view 2
Mod+Ctrl+2 = toggleview 2
Mod+Shift+2 = tag 2
Mod+Shift+Ctrl+2 = toggletag 2
Mod+3 = view 3
Mod+Ctrl+3 = toggleview 3
Mod+Shift+3 = tag 3
Mod+Shift+Ctrl+3 = toggletag 3
Mod+4 = view 4
Mod+Ctrl+4 = toggleview 4
Mod+Shift+4 = tag 4
Mod+Shift+Ctrl+4 = toggletag 4
Mod+5 = view 5
Mod+Ctrl+5 = toggleview 5
Mod+Shift+5 = tag 5
Mod+Shift+Ctrl+5 = toggletag 5
Mod+6 = view 6
Mod+Ctrl+6 = toggleview 6
Mod+Shift+6 = tag 6
Mod+Shift+Ctrl+6 = toggletag 6
Mod+7 = view 7
Mod+Ctrl+7 = toggleview 7
Mod+Shift+7 = tag 7
Mod+Shift+Ctrl+7 = toggletag 7
Mod+8 = view 8
Mod+Ctrl+8 = toggleview 8
Mod+Shift+8 = tag 8
Mod+Shift+Ctrl+8 = toggletag 8
Mod+9 = view 9
Mod+Ctrl+9 = toggleview 9
Mod+Shift+9 = tag 9
Mod+Shift+Ctrl+9 = toggletag 9
Mod+Shift+g = togglecanvas
Mod+Shift+l = spawn rice-lock
Mod+Shift+r = spawn rice-record
Mod+Left = snapwin 0
Mod+Right = snapwin 1
Mod+Up = snapwin 2
Mod+Down = snapwin 3
Mod+Shift+Left = movewin 0
Mod+Shift+Right = movewin 1
Mod+Shift+Up = movewin 2
Mod+Shift+Down = movewin 3
Mod+Ctrl+Left = sizewin 0
Mod+Ctrl+Right = sizewin 1
Mod+Ctrl+Up = sizewin 2
Mod+Ctrl+Down = sizewin 3
Mod+Shift+q = quit 0
Mod+Shift+Ctrl+q = quit 1
Mod+Shift+j = movestack 1
Mod+Shift+k = movestack -1
Mod+n = spawn ~/.local/share/dss/bin/rice-cc
Mod+e = spawn ~/.local/share/dss/bin/rice-edit
Mod+g = spawn ~/.local/share/dss/bin/rice-gamebar
Mod+w = spawn ~/.local/share/dss/bin/rice-dashboard wallpaper
Mod+slash = spawn ~/.local/share/dss/bin/rice-keymap show
Mod+Shift+n = spawn ~/.local/share/dss/bin/rice-dashboard open
