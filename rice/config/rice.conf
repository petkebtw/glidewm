backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

# frosted glass behind translucent windows (launcher, OSD, cards)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 3;

corner-radius = 14;

# soft shadows only on our glass popups (rule below turns them off elsewhere)
shadow = false;
shadow-radius = 30;
shadow-opacity = 0.5;
shadow-offset-x = 0;
shadow-offset-y = 10;

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# Per-window rules (picom 13). Rules do not override each other reliably, so every
# match is written to be exclusive.
# Animations: dwm snaps to the final geometry, picom animates it. Our own popups
# (RiceCard ghosts animate themselves), the dwm bar and the systray are excluded.
rules = (
  { match = "class_g = 'dwm'"; corner-radius = 10; shadow = false; },
  { match = "class_g = 'dwmtray'"; corner-radius = 0; shadow = false; },
  { match = "class_g = 'RiceGhost'"; corner-radius = 26; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceGrow'"; corner-radius = 0; shadow = false; blur-background = false; fade = false; },
  { match = "class_g = 'RiceNeck'"; corner-radius = 0; shadow = false; blur-background = false; fade = false; },
  {
    match = "class_g = 'RiceCard'"; corner-radius = 26; blur-strength = 18; shadow = true; fade = false;
  },
  {
    match = "class_g = 'RicePanel'"; corner-radius = 26; blur-strength = 18; shadow = true; fade = false;
  },
  {
    match = "class_g = 'Rofi'"; corner-radius = 26; shadow = true;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.04; start = 0; end = "window-raw-opacity"; };
        blur-opacity = { curve = "linear"; duration = 0.4; start = 0; end = 0; }; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.16,1,0.3,1)"; duration = 0.26; start = 0.2; end = 1; };
        scale-y = { curve = "cubic-bezier(0.2,1.0,0.3,1)"; duration = 0.38; start = 0.08; end = 1; };
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = 0;
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.7,0,1,1)"; duration = 0.22; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = { curve = "cubic-bezier(0.1,0.9,0.2,1)"; duration = 0.1; start = 1; end = 0; }; shadow-opacity = "opacity";
        scale-y = { curve = "cubic-bezier(0.5,0,0.9,0.4)"; duration = 0.22; start = 1; end = 0.08; };
        scale-x = { curve = "cubic-bezier(0.5,0,0.9,0.4)"; duration = 0.22; start = 1; end = 0.2; };
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = 0;
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; }
    );
  },
  {
    match = "class_g = 'RiceAuth'"; corner-radius = 0; shadow = true;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "linear"; duration = 0.04; start = 0; end = "window-raw-opacity"; };
        blur-opacity = { curve = "linear"; duration = 0.4; start = 0; end = 0; }; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.16,1,0.3,1)"; duration = 0.3; start = 0.7; end = 1; };
        scale-y = { curve = "cubic-bezier(0.2,1.0,0.3,1)"; duration = 0.3; start = 0.7; end = 1; };
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.7,0,1,1)"; duration = 0.22; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = { curve = "cubic-bezier(0.1,0.9,0.2,1)"; duration = 0.1; start = 1; end = 0; }; shadow-opacity = "opacity";
        scale-y = { curve = "cubic-bezier(0.5,0,0.9,0.4)"; duration = 0.22; start = 1; end = 0.7; };
        scale-x = { curve = "cubic-bezier(0.5,0,0.9,0.4)"; duration = 0.22; start = 1; end = 0.7; };
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; }
    );
  },
  { match = "class_g = 'SCGlass'"; corner-radius = 14; shadow = false; },
  { match = "class_g = 'RiceLock' || class_g = 'RiceShot'"; corner-radius = 0; blur-background = false; shadow = false; },
  { match = "fullscreen"; corner-radius = 0; blur-background = false; shadow = false; fade = false; },
  { match = "class_g = 'RiceDock'"; corner-radius = 22; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceDockFx'"; corner-radius = 0; shadow = false; blur-background = false; fade = false; },
  { match = "class_g = 'RiceGhostM3'"; corner-radius = 34; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceCardM3'"; corner-radius = 34; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RicePanelM3'"; corner-radius = 34; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceDockM3'"; corner-radius = 30; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceDeskGlassM3'"; corner-radius = 30; blur-strength = 18; shadow = false; fade = false; },
  { match = "class_g = 'RiceGhostMac'"; corner-radius = 18; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceCardMac'"; corner-radius = 18; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RicePanelMac'"; corner-radius = 18; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceDockMac'"; corner-radius = 15; blur-strength = 18; shadow = true; fade = false; },
  { match = "class_g = 'RiceDeskGlassMac'"; corner-radius = 15; blur-strength = 18; shadow = false; fade = false; },
  { match = "class_g = 'RiceGhostBr'"; corner-radius = 0; blur-strength = 18; shadow = false; fade = false; },
  { match = "class_g = 'RiceCardBr'"; corner-radius = 0; blur-strength = 18; shadow = false; fade = false; },
  { match = "class_g = 'RicePanelBr'"; corner-radius = 0; blur-strength = 18; shadow = false; fade = false; },
  { match = "class_g = 'RiceDockBr'"; corner-radius = 0; blur-strength = 18; shadow = false; fade = false; },
  { match = "class_g = 'RiceDeskGlassBr'"; corner-radius = 0; blur-strength = 18; shadow = false; fade = false; },
  { match = "name = 'quickshell'"; corner-radius = 0; shadow = false; blur-background = false; fade = false; },
  { match = "class_g = 'RiceIsland'"; corner-radius = 0; shadow = false; blur-background = false; fade = false; },
  { match = "class_g = 'RiceDesk' || class_g = 'RiceDeskOverlay'"; corner-radius = 0; blur-background = false; shadow = false; fade = false; },
  { match = "class_g = 'RiceDeskGlass'"; corner-radius = 22; blur-strength = 18; shadow = false; fade = false; },
  { match = "window_type = 'desktop' && !(class_g = 'RiceDesk' || class_g = 'RiceDeskGlass' || class_g = 'RiceDeskGlassM3' || class_g = 'RiceDeskGlassMac' || class_g = 'RiceDeskGlassBr' || class_g = 'RiceDeskOverlay')"; corner-radius = 0; blur-background = false; shadow = false; },
  { match = "(window_type = 'normal' || window_type = 'dialog') && !fullscreen && !(class_g = 'RiceAuth' || class_g = 'RicePanel' || class_g = 'RicePanelM3' || class_g = 'RicePanelMac' || class_g = 'RicePanelBr' || class_g = 'RiceGhost' || class_g = 'RiceGhostM3' || class_g = 'RiceGhostMac' || class_g = 'RiceGhostBr' || class_g = 'RiceGrow' || class_g = 'Rofi' || class_g = 'RiceCard' || class_g = 'RiceCardM3' || class_g = 'RiceCardMac' || class_g = 'RiceCardBr' || class_g = 'RiceLock' || class_g = 'RiceShot' || class_g = 'RiceNeck' || class_g = 'dwm' || class_g = 'RiceDock' || class_g = 'RiceDockM3' || class_g = 'RiceDockMac' || class_g = 'RiceDockBr' || class_g = 'RiceDockFx' || class_g = 'RiceDesk' || class_g = 'RiceDeskGlass' || class_g = 'RiceDeskGlassM3' || class_g = 'RiceDeskGlassMac' || class_g = 'RiceDeskGlassBr' || class_g = 'RiceDeskOverlay' || class_g = 'dwmtray' || class_g = 'SCGlass')"; shadow = false; },
  {
    match = "(window_type = 'normal' || window_type = 'dialog') && !fullscreen && !(class_g = 'Rofi' || class_g = 'RiceGhost' || class_g = 'RiceGhostM3' || class_g = 'RiceGhostMac' || class_g = 'RiceGhostBr' || class_g = 'RiceGrow' || class_g = 'RiceNeck' || class_g = 'RicePanel' || class_g = 'RicePanelM3' || class_g = 'RicePanelMac' || class_g = 'RicePanelBr' || class_g = 'RiceAuth' || class_g = 'RiceCard' || class_g = 'RiceCardM3' || class_g = 'RiceCardMac' || class_g = 'RiceCardBr' || class_g = 'RiceLock' || class_g = 'RiceShot' || class_g = 'dwm' || class_g = 'RiceDock' || class_g = 'RiceDockM3' || class_g = 'RiceDockMac' || class_g = 'RiceDockBr' || class_g = 'RiceDockFx' || class_g = 'RiceDesk' || class_g = 'RiceDeskGlass' || class_g = 'RiceDeskGlassM3' || class_g = 'RiceDeskGlassMac' || class_g = 'RiceDeskGlassBr' || class_g = 'RiceDeskOverlay' || class_g = 'dwmtray')";
    animations = (
      { triggers = ["open", "show"]; preset = "appear"; scale = 0.93; duration = 0.2; curve = "cubic-bezier(0.22,1,0.36,1)"; },
      { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.96; duration = 0.14; curve = "cubic-bezier(0.22,1,0.36,1)"; }
    );
  }
);
