<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <title>glidewm</title>
  <rect width="1280" height="400" rx="40" fill="#0d0f1e"/>
  <g transform="translate(40,44) scale(0.609)">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141833"/>
      <stop offset="1" stop-color="#0a0b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>
  <!-- speed lines -->
  <rect x="58"  y="196" width="120" height="14" rx="7" fill="url(#trail)" opacity="0.55"/>
  <rect x="36"  y="250" width="150" height="14" rx="7" fill="url(#trail)" opacity="0.8"/>
  <rect x="70"  y="304" width="104" height="14" rx="7" fill="url(#trail)" opacity="0.45"/>
  <!-- ghost panes left behind by the slide -->
  <rect x="150" y="150" width="230" height="212" rx="30" fill="url(#pane)" opacity="0.14"/>
  <rect x="182" y="150" width="230" height="212" rx="30" fill="url(#pane)" opacity="0.28"/>
  <!-- the window -->
  <g>
    <rect x="216" y="150" width="230" height="212" rx="30" fill="url(#pane)"/>
    <rect x="216" y="150" width="230" height="212" rx="30" fill="url(#sheen)"/>
    <rect x="216" y="150" width="230" height="52" rx="30" fill="#0a0b18" fill-opacity="0.18"/>
    <circle cx="250" cy="176" r="9" fill="#0a0b18" fill-opacity="0.55"/>
    <circle cx="278" cy="176" r="9" fill="#0a0b18" fill-opacity="0.4"/>
    <circle cx="306" cy="176" r="9" fill="#0a0b18" fill-opacity="0.28"/>
    <rect x="246" y="228" width="120" height="14" rx="7" fill="#0a0b18" fill-opacity="0.28"/>
    <rect x="246" y="258" width="168" height="14" rx="7" fill="#0a0b18" fill-opacity="0.2"/>
    <rect x="246" y="288" width="92"  height="14" rx="7" fill="#0a0b18" fill-opacity="0.2"/>
  </g>
  <!-- tag dots, the bar's tags: the one being glided to is lit -->
  <circle cx="200" cy="412" r="10" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="236" cy="412" r="10" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="262" y="402" width="52" height="20" rx="10" fill="url(#pane)"/>
  <circle cx="340" cy="412" r="10" fill="#ffffff" fill-opacity="0.18"/>
  </g>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <text x="400" y="238" font-family="Inter Display, Inter, sans-serif" font-weight="800" font-size="176" letter-spacing="-6" fill="#e8eaff">glide<tspan fill="url(#word)">wm</tspan></text>
  <text x="408" y="310" font-family="Inter, sans-serif" font-weight="500" font-size="34" letter-spacing="1" fill="#8b90b8">smooth tiling for X11 · a dwm fork</text>
</svg>
